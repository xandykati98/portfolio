<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pre-EDA overview of IMDC 2026 datasets"
    />
    <title>Pre-EDA — xandykati98</title>
    <link rel="icon" href="../logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <h1 class="site-title">xandykati98</h1>
      <p class="site-tagline">Pre-EDA — <code>data_imdc_2026</code></p>
    </header>

    <main id="main" class="site-main">
      <article class="markdown-body" id="markdown-root" aria-live="polite">
        <p class="page-nav"><a href="../index.html">← home</a></p>
        <p>Loading…</p>
      </article>
    </main>

    <footer class="site-footer">
      <p>
        rendered from
        <a href="./PRE_EDA.md"><code>PRE_EDA.md</code></a>
      </p>
    </footer>

    <dialog id="plot-lightbox" class="plot-lightbox" aria-label="Expanded plot">
      <img class="plot-lightbox__img" alt="" decoding="async" />
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script>
      (function () {
        var MARKDOWN_PATH = "./PRE_EDA.md";
        var IMAGE_PREFIX = "data_imdc_2026/pre_eda/plots/";
        var IMAGE_REPLACEMENT = "plots/";

        function rewriteImagePaths(markdown) {
          return markdown.split(IMAGE_PREFIX).join(IMAGE_REPLACEMENT);
        }

        function renderMarkdown(markdown) {
          marked.setOptions({
            gfm: true,
            breaks: false,
          });
          return marked.parse(markdown);
        }

        function enhanceColumnHovers(root) {
          var triggers = root.querySelectorAll(".columns-more");
          for (var i = 0; i < triggers.length; i++) {
            var listItem = triggers[i].closest("li");
            if (listItem) {
              listItem.classList.add("columns-item");
            }
          }
        }

        function enhancePlotImages(root) {
          var lightbox = document.getElementById("plot-lightbox");
          if (!lightbox) {
            return;
          }
          var lightboxImage = lightbox.querySelector(".plot-lightbox__img");
          if (!lightboxImage) {
            return;
          }

          function openLightbox(sourceImage) {
            lightboxImage.src = sourceImage.currentSrc || sourceImage.src;
            lightboxImage.alt = sourceImage.alt || "Expanded plot";
            if (typeof lightbox.showModal === "function") {
              lightbox.showModal();
            }
          }

          function closeLightbox() {
            if (!lightbox.open) {
              return;
            }
            lightbox.close();
            lightboxImage.removeAttribute("src");
            lightboxImage.alt = "";
          }

          if (!lightbox.dataset.bound) {
            lightbox.dataset.bound = "true";
            lightbox.addEventListener("click", function (event) {
              if (event.target === lightbox) {
                closeLightbox();
              }
            });
            lightboxImage.addEventListener("click", function () {
              closeLightbox();
            });
            lightbox.addEventListener("close", function () {
              lightboxImage.removeAttribute("src");
              lightboxImage.alt = "";
            });
          }

          var images = root.querySelectorAll("img");
          for (var i = 0; i < images.length; i++) {
            var image = images[i];
            if (image.classList.contains("plot-lightbox__img")) {
              continue;
            }
            image.tabIndex = 0;
            image.addEventListener("click", function (event) {
              openLightbox(event.currentTarget);
            });
            image.addEventListener("keydown", function (event) {
              if (event.key !== "Enter" && event.key !== " ") {
                return;
              }
              event.preventDefault();
              openLightbox(event.currentTarget);
            });
          }
        }

        function showError(root, message) {
          root.innerHTML =
            '<p class="page-nav"><a href="../index.html">← home</a></p>' +
            '<p class="markdown-error">' +
            message +
            "</p>";
        }

        function init() {
          var root = document.getElementById("markdown-root");
          if (!root) {
            return;
          }

          fetch(MARKDOWN_PATH)
            .then(function (response) {
              if (!response.ok) {
                throw new Error(
                  "Could not load PRE_EDA.md (" + response.status + ")"
                );
              }
              return response.text();
            })
            .then(function (markdown) {
              var html =
                '<p class="page-nav"><a href="../index.html">← home</a></p>' +
                renderMarkdown(rewriteImagePaths(markdown));
              root.innerHTML = html;
              enhanceColumnHovers(root);
              enhancePlotImages(root);
            })
            .catch(function (error) {
              showError(
                root,
                error instanceof Error ? error.message : String(error)
              );
            });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
